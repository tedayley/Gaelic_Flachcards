          <span class="related-words" id="card-related"></span>
          <span class="note" id="card-note"></span>
        </span>
      </button>

      <div class="progress">
        <span id="progress-label">1 / 1</span>
        <div class="progress-track"><span id="progress-bar"></span></div>
      </div>

      <nav class="controls" aria-label="Flashcard controls">
        <button id="previous-button" class="nav-button" type="button" aria-label="Previous card">←</button>
        <button id="shuffle-button" class="small-button" type="button">Shuffle</button>
        <button id="flip-button" class="flip-button" type="button">Flip</button>
        <button id="next-button" class="nav-button" type="button" aria-label="Next card">→</button>
      </nav>

      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="Find a word…" autocomplete="off">
        <button id="clear-search" type="button" aria-label="Clear search">×</button>
      </label>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="keyboard-help"><kbd>←</kbd> <kbd>→</kbd> move <span>·</span> <kbd>Space</kbd> flip</p>
    </section>

    <footer></footer>
  </main>
</body>
</html>
